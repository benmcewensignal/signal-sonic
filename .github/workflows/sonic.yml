name: sonic
on:
  schedule:
    - cron: "0 3 * * 0"        # Sundays 03:00 UTC — the weekly batch
    - cron: "0 6 * * 1,4"      # Mon+Thu 06:00 UTC — RA depth snapshot (unbackfillable)
  push:
    paths: ["queue/*.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "what to run"
        type: choice
        default: week
        options: [queue, genres, chart, week, backfill, backfill-report, reindex, mixscan, mixrescan, names, radepth, metadata, artists, listeners, supply, nts, discogs]
      genre_id:
        description: "genre id (chart mode only)"
        required: false
      month_from:
        description: "backfill start, e.g. 2024-09"
        required: false
      month_to:
        description: "backfill end, e.g. 2024-11 (4-month ranges fit the ceiling)"
        required: false
      scenes:
        description: "backfill: restrict to these scene ids, comma-separated (e.g. hard-techno,bass-house,trance-main-floor)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sonic-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # one job per run: a failure costs one job, not a night
    env:
      PYTHONUNBUFFERED: "1"
      BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
      BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
      BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
      BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: show queue (push runs drain it below)
        if: github.event_name == 'push'
        run: ls -la queue/ && cat queue/done.json 2>/dev/null | tail -5 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: deps
        run: |
          sudo apt-get update -yq > /dev/null && sudo apt-get -yq install libsndfile1 ffmpeg > /dev/null
          pip -q install -r requirements.txt yt-dlp curl_cffi
          echo "decode stack:" && ffmpeg -version | head -1
          python -c "from sonic.analyser_local import _decoder_fingerprint as f; print('decoder fingerprint:', f())" 

      - name: genres check
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'genres'
        run: python -m sonic.beatport genres | tee data/beatport-genres.txt

      - name: chart check
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'chart'
        run: python -m sonic.beatport chart --genre-id "${{ inputs.genre_id }}"

      - name: backfill fetch
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        run: |
          python -m sonic.backfill fetch --from "${{ inputs.month_from }}" \
            --to "${{ inputs.month_to }}" --db sonic.db --analyser local \
            ${{ inputs.scenes != '' && format('--scenes "{0}"', inputs.scenes) || '' }}

      - name: backfill report
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill-report'
        run: python -m sonic.backfill report --db sonic.db --out backfill-report

      - name: fetch fingerprint store
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'reindex' || inputs.mode == 'mixscan' || inputs.mode == 'mixrescan'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download fp-store --pattern fingerprints.db --clobber --dir . || \
            gh release download fp-store -p fingerprints.db -O fingerprints.db || true
          if [ -f fingerprints.db ]; then
            SZ=$(du -m fingerprints.db | cut -f1)
            echo "FP_MB=${SZ}" >> $GITHUB_ENV
            N=$(python -c "import sqlite3;print(sqlite3.connect('fingerprints.db').execute('select count(*) from fp_tracks').fetchone()[0])" 2>/dev/null || echo 0)
            echo "store fetched ${SZ} MB, ${N} tracks indexed"
            if [ "$N" -eq 0 ]; then echo "::error::fingerprint store is empty - scans would match nothing"; exit 1; fi
          else
            echo "FP_MB=0" >> $GITHUB_ENV
            echo "::error::no fingerprint store could be downloaded"
            exit 1
          fi

      - name: drain the job queue (one job per run)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'queue')
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          # a push run is pinned to its triggering commit; long jobs must use current code
          git fetch origin main && git checkout -q origin/main -- sonic/ .github/workflows/ || true
          git log -1 --format='queue running code from %h %s' origin/main
          python -m sonic.queue_runner --budget-minutes 75 --max-jobs 1

      - name: reindex fingerprints
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reindex'
        run: python -m sonic.mixes reindex --db sonic.db --limit 900

      - name: mix discovery + scan
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mixscan'
        run: python -m sonic.discover scan --db sonic.db --per-scene 2 --max-minutes 110 --budget-minutes 240

      - name: mix rescan (re-score stored mixes after a matcher change)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mixrescan'
        run: python -m sonic.discover scan --db sonic.db --rescan --max-minutes 110 --budget-minutes 240

      - name: RA depth snapshot
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,4') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'radepth')
        run: |
          for i in $(seq 1 12); do
            out=$(curl -s "https://www.earlysignal.live/api/ra-depth?run=1")
            echo "$out" | head -c 400; echo
            echo "$out" | grep -q '"status":"complete"' && break
            sleep 2
          done
          curl -s "https://www.earlysignal.live/api/ra-history?run=1" | head -c 300; echo

      - name: name atomic tracks
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'names'
        run: python -m sonic.names

      - name: calibrate set-layer matcher against the chronological null
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'mixrescan' || inputs.mode == 'mixscan' || inputs.mode == 'artists')
        run: python -m sonic.calibrate_plays --db sonic.db || true

      - name: supply counts for every genre (on demand)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'supply'
        run: python -m sonic.supply --db sonic.db --fetch --months 24 --out data/supply.json

      - name: texture names (what the residual actually is)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'backfill' || inputs.mode == 'artists'))
        run: python -m sonic.texture --db sonic.db --out data/texture.json || true

      - name: supply series (Beatport month totals + what moves first)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'backfill' || inputs.mode == 'artists'))
        run: python -m sonic.supply --db sonic.db --out data/supply.json || true

      - name: artist join (after depth snapshot / metadata / on demand)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,4') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'radepth' || inputs.mode == 'metadata' || inputs.mode == 'artists' || inputs.mode == 'mixrescan' || inputs.mode == 'mixscan'))
        run: python -m sonic.artists --db sonic.db --site https://www.earlysignal.live --out data/artists-latest.json

      - name: venue layer (after the artist join)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,4') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'radepth' || inputs.mode == 'metadata' || inputs.mode == 'artists'))
        run: python -m sonic.venues --site https://www.earlysignal.live --artists data/artists-latest.json --out data/venues-latest.json

      - name: NTS tracklists (ground truth for the set layer)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'nts'
        run: python -m sonic.nts_tracklists --db sonic.db --limit 200 --out data/nts-truth.json

      - name: Discogs aliases and labels
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discogs'
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python -m sonic.discogs --db sonic.db --limit 600

      - name: streaming stock (Last.fm listeners per artist)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'listeners'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python -m sonic.listeners --db sonic.db --limit 800

      - name: track metadata (release-side artist ids)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'metadata'
        run: python -m sonic.metadata --db sonic.db --limit 3000

      - name: weekly batch
        if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'week')
        run: |
          WEEK=$(date +%G-W%V)
          python -m sonic.run_week --week "$WEEK" \
            --scenes "$(python -c "import json;m=json.load(open('scene_map.json'));print(','.join(sorted({v['scene'] for k,v in m.items() if not k.startswith('_')})))")" \
            --source beatport --analyser local --db sonic.db | tee run-report.json

      - name: demand export
        if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'week')
        env:
          SONIC_INGEST_SECRET: ${{ secrets.SONIC_INGEST_SECRET }}
        run: python -m sonic.export_demand --db sonic.db --post https://www.earlysignal.live/api/sonic-ingest || true
      - name: save fingerprint store
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'reindex' || inputs.mode == 'mixscan' || inputs.mode == 'mixrescan')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f fingerprints.db ]; then
            SZ=$(du -m fingerprints.db | cut -f1)
            # never clobber a good store with a smaller one: an empty local store
            # would otherwise destroy the index for every future run
            if [ "${FP_MB:-0}" -gt 0 ] && [ "$SZ" -lt "${FP_MB}" ]; then
              echo "::warning::local store ${SZ}MB is smaller than the fetched ${FP_MB}MB - not uploading"
            else
              gh release create fp-store --notes "fingerprint index (release asset: too large for git)" 2>/dev/null || true
              gh release upload fp-store fingerprints.db --clobber
              echo "store saved: ${SZ}MB"
            fi
          fi

      - name: persist database
        if: always() && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set +e
          git config user.name "sonic-bot"
          git config user.email "sonic@earlysignal.live"
          STATUS="unknown"
          # copy the outputs aside, take whatever main has become, put them back.
          # never stash/pop: a pop conflict leaves markers and we then commit them.
          for i in 1 2 3 4 5; do
            rm -rf /tmp/out && mkdir -p /tmp/out
            cp -a sonic.db /tmp/out/ 2>/dev/null
            cp -a data /tmp/out/ 2>/dev/null
            cp -a queue /tmp/out/ 2>/dev/null
            cp -a backfill-report.md backfill-report.json CLAIMS.md /tmp/out/ 2>/dev/null
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -a /tmp/out/sonic.db . 2>/dev/null
            cp -a /tmp/out/data /tmp/out/queue . 2>/dev/null
            cp -a /tmp/out/backfill-report.md /tmp/out/backfill-report.json /tmp/out/CLAIMS.md . 2>/dev/null
            git add -f sonic.db 2>/dev/null
            git add -A data queue backfill-report.md backfill-report.json CLAIMS.md 2>/dev/null
            if git diff --cached --quiet; then STATUS="nothing to persist"; break; fi
            git commit -q -m "queue run $(date +%G-W%V)"
            if git push -q origin HEAD:main; then STATUS="persisted on attempt $i"; break; fi
            STATUS="push race, retrying"
            sleep $((i*10))
          done
          echo "persist: $STATUS"
          exit 0

      - name: next job (chain a follow-up run while work remains)
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'queue'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f queue/.next ]; then
            echo "next: $(cat queue/.next)"
            gh workflow run sonic.yml --ref main -f mode=queue && echo "follow-up run dispatched" || echo "dispatch failed"
          else
            echo "queue empty; no follow-up"
          fi
