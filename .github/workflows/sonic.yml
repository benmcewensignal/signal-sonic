name: sonic
on:
  schedule:
    - cron: "0 3 * * 0"        # Sundays 03:00 UTC — the weekly batch
  workflow_dispatch:
    inputs:
      mode:
        description: "what to run"
        type: choice
        default: week
        options: [genres, chart, week, backfill, backfill-report, reindex, mixscan, names]
      genre_id:
        description: "genre id (chart mode only)"
        required: false
      month_from:
        description: "backfill start, e.g. 2024-09"
        required: false
      month_to:
        description: "backfill end, e.g. 2024-11 (keep ranges to ~3 months per run)"
        required: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's job ceiling is 360; leave room to persist
    env:
      PYTHONUNBUFFERED: "1"
      BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
      BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
      BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
      BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: deps
        run: |
          sudo apt-get -yq install libsndfile1 ffmpeg > /dev/null
          pip -q install -r requirements.txt yt-dlp curl_cffi
          echo "decode stack:" && ffmpeg -version | head -1
          python -c "from sonic.analyser_local import _decoder_fingerprint as f; print('decoder fingerprint:', f())" 

      - name: genres check
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'genres'
        run: python -m sonic.beatport genres

      - name: chart check
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'chart'
        run: python -m sonic.beatport chart --genre-id "${{ inputs.genre_id }}"

      - name: backfill fetch
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        run: |
          python -m sonic.backfill fetch --from "${{ inputs.month_from }}" \
            --to "${{ inputs.month_to }}" --db sonic.db --analyser local

      - name: backfill report
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill-report'
        run: python -m sonic.backfill report --db sonic.db --out backfill-report

      - name: fetch fingerprint store
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'reindex' || inputs.mode == 'mixscan')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download fp-store -p fingerprints.db -O fingerprints.db 2>/dev/null; then
            echo "store fetched ($(du -m fingerprints.db | cut -f1) MB)"
          else
            echo "no fingerprint store yet - starting fresh"
          fi

      - name: reindex fingerprints
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reindex'
        run: python -m sonic.mixes reindex --db sonic.db --limit 900

      - name: mix discovery + scan
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mixscan'
        run: python -m sonic.discover scan --db sonic.db --per-scene 2 --max-minutes 110

      - name: name atomic tracks
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'names'
        run: python -m sonic.names

      - name: weekly batch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'week')
        run: |
          WEEK=$(date +%G-W%V)
          python -m sonic.run_week --week "$WEEK" \
            --scenes uk-garage-speed-garage,uk-funky-gqom,afro-house,amapiano,140-deep-dubstep-grime,breaks-breakbeat-uk-bass,tech-house,techno-peak-time,techno-raw-deep-hypnotic,house,deep-house,melodic-house-techno,drum-and-bass \
            --source beatport --analyser local --db sonic.db | tee run-report.json

      - name: demand export
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'week')
        env:
          SONIC_INGEST_SECRET: ${{ secrets.SONIC_INGEST_SECRET }}
        run: python -m sonic.export_demand --db sonic.db --post https://www.earlysignal.live/api/sonic-ingest || true
      - name: save fingerprint store
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.mode == 'reindex' || inputs.mode == 'mixscan')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f fingerprints.db ]; then
            gh release create fp-store --notes "fingerprint index (release asset: too large for git)" 2>/dev/null || true
            gh release upload fp-store fingerprints.db --clobber
            echo "store saved: $(du -m fingerprints.db | cut -f1)MB"
          fi

      - name: persist database
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'week' || inputs.mode == 'backfill' || inputs.mode == 'backfill-report' || inputs.mode == 'reindex' || inputs.mode == 'mixscan')))
        run: |
          git config user.name "sonic-bot"
          git config user.email "sonic@earlysignal.live"
          git pull --rebase --autostash -q origin main || true
          git add -f sonic.db
          git add backfill-report.md backfill-report.json 2>/dev/null || true
          git add CLAIMS.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "weekly run $(date +%G-W%V)"
          git push
