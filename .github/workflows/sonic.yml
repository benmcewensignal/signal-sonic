name: sonic
on:
  schedule:
    - cron: "0 3 * * 0"        # Sundays 03:00 UTC — the weekly batch
    - cron: "0 6 * * 1,4"      # Mon+Thu 06:00 UTC — RA depth snapshot (unbackfillable)
  push:
    paths: ["queue/*.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "what to run"
        type: choice
        default: week
        options: [genres, chart, week, backfill, backfill-report, reindex, mixscan, mixrescan, names, radepth, metadata, artists]
      genre_id:
        description: "genre id (chart mode only)"
        required: false
      month_from:
        description: "backfill start, e.g. 2024-09"
        required: false
      month_to:
        description: "backfill end, e.g. 2024-11 (4-month ranges fit the ceiling)"
        required: false
      scenes:
        description: "backfill: restrict to these scene ids, comma-separated (e.g. hard-techno,bass-house,trance-main-floor)"
        required: false

permissions:
  contents: write

concurrency:
  group: sonic-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # GitHub's job ceiling is 360; leave room to persist
    env:
      PYTHONUNBUFFERED: "1"
      BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
      BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
      BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
      BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: read queued job
        id: q
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            f=$(git log -1 --name-only --pretty=format: -- queue | grep 'queue/.*\.json' | head -1)
            [ -z "$f" ] && f=$(ls -t queue/*.json | head -1)
            echo "file=$f" >> $GITHUB_OUTPUT
            for k in mode month_from month_to scenes genre_id; do
              echo "$k=$(python3 -c "import json,sys;print(json.load(open('$f')).get('$k',''))")" >> $GITHUB_OUTPUT
            done
            echo "queued: $f"; cat "$f"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: deps
        run: |
          sudo apt-get update -yq > /dev/null && sudo apt-get -yq install libsndfile1 ffmpeg > /dev/null
          pip -q install -r requirements.txt yt-dlp curl_cffi
          echo "decode stack:" && ffmpeg -version | head -1
          python -c "from sonic.analyser_local import _decoder_fingerprint as f; print('decoder fingerprint:', f())" 

      - name: genres check
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'genres'
        run: python -m sonic.beatport genres | tee data/beatport-genres.txt

      - name: chart check
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'chart'
        run: python -m sonic.beatport chart --genre-id "${{ (inputs.genre_id || steps.q.outputs.genre_id) }}"

      - name: backfill fetch
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'backfill'
        run: |
          python -m sonic.backfill fetch --from "${{ (inputs.month_from || steps.q.outputs.month_from) }}" \
            --to "${{ (inputs.month_to || steps.q.outputs.month_to) }}" --db sonic.db --analyser local \
            ${{ (inputs.scenes || steps.q.outputs.scenes) != '' && format('--scenes "{0}"', (inputs.scenes || steps.q.outputs.scenes)) || '' }}

      - name: backfill report
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'backfill-report'
        run: python -m sonic.backfill report --db sonic.db --out backfill-report

      - name: fetch fingerprint store
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && ((inputs.mode || steps.q.outputs.mode) == 'reindex' || (inputs.mode || steps.q.outputs.mode) == 'mixscan' || (inputs.mode || steps.q.outputs.mode) == 'mixrescan')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download fp-store -p fingerprints.db -O fingerprints.db 2>/dev/null; then
            echo "store fetched ($(du -m fingerprints.db | cut -f1) MB)"
          else
            echo "no fingerprint store yet - starting fresh"
          fi

      - name: reindex fingerprints
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'reindex'
        run: python -m sonic.mixes reindex --db sonic.db --limit 900

      - name: mix discovery + scan
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'mixscan'
        run: python -m sonic.discover scan --db sonic.db --per-scene 2 --max-minutes 110 --budget-minutes 240

      - name: mix rescan (re-score stored mixes after a matcher change)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'mixrescan'
        run: python -m sonic.discover scan --db sonic.db --rescan --max-minutes 110 --budget-minutes 240

      - name: RA depth snapshot
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,4') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'radepth')
        run: |
          for i in $(seq 1 12); do
            out=$(curl -s "https://www.earlysignal.live/api/ra-depth?run=1")
            echo "$out" | head -c 400; echo
            echo "$out" | grep -q '"status":"complete"' && break
            sleep 2
          done
          curl -s "https://www.earlysignal.live/api/ra-history?run=1" | head -c 300; echo

      - name: name atomic tracks
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'names'
        run: python -m sonic.names

      - name: calibrate set-layer matcher against the chronological null
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && ((inputs.mode || steps.q.outputs.mode) == 'mixrescan' || (inputs.mode || steps.q.outputs.mode) == 'mixscan' || (inputs.mode || steps.q.outputs.mode) == 'artists')
        run: python -m sonic.calibrate_plays --db sonic.db || true

      - name: artist join (after depth snapshot / metadata / on demand)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,4') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && ((inputs.mode || steps.q.outputs.mode) == 'radepth' || (inputs.mode || steps.q.outputs.mode) == 'metadata' || (inputs.mode || steps.q.outputs.mode) == 'artists' || (inputs.mode || steps.q.outputs.mode) == 'mixrescan' || (inputs.mode || steps.q.outputs.mode) == 'mixscan'))
        run: python -m sonic.artists --db sonic.db --site https://www.earlysignal.live --out data/artists-latest.json

      - name: venue layer (after the artist join)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,4') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && ((inputs.mode || steps.q.outputs.mode) == 'radepth' || (inputs.mode || steps.q.outputs.mode) == 'metadata' || (inputs.mode || steps.q.outputs.mode) == 'artists'))
        run: python -m sonic.venues --site https://www.earlysignal.live --artists data/artists-latest.json --out data/venues-latest.json

      - name: track metadata (release-side artist ids)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'metadata'
        run: python -m sonic.metadata --db sonic.db --limit 3000

      - name: weekly batch
        if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'week')
        run: |
          WEEK=$(date +%G-W%V)
          python -m sonic.run_week --week "$WEEK" \
            --scenes "$(python -c "import json;m=json.load(open('scene_map.json'));print(','.join(sorted({v['scene'] for k,v in m.items() if not k.startswith('_')})))")" \
            --source beatport --analyser local --db sonic.db | tee run-report.json

      - name: demand export
        if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (inputs.mode || steps.q.outputs.mode) == 'week')
        env:
          SONIC_INGEST_SECRET: ${{ secrets.SONIC_INGEST_SECRET }}
        run: python -m sonic.export_demand --db sonic.db --post https://www.earlysignal.live/api/sonic-ingest || true
      - name: save fingerprint store
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && ((inputs.mode || steps.q.outputs.mode) == 'reindex' || (inputs.mode || steps.q.outputs.mode) == 'mixscan' || (inputs.mode || steps.q.outputs.mode) == 'mixrescan')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f fingerprints.db ]; then
            gh release create fp-store --notes "fingerprint index (release asset: too large for git)" 2>/dev/null || true
            gh release upload fp-store fingerprints.db --clobber
            echo "store saved: $(du -m fingerprints.db | cut -f1)MB"
          fi

      - name: persist database
        if: always() && (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && ((inputs.mode || steps.q.outputs.mode) == 'week' || (inputs.mode || steps.q.outputs.mode) == 'backfill' || (inputs.mode || steps.q.outputs.mode) == 'backfill-report' || (inputs.mode || steps.q.outputs.mode) == 'reindex' || (inputs.mode || steps.q.outputs.mode) == 'mixscan' || (inputs.mode || steps.q.outputs.mode) == 'mixrescan' || (inputs.mode || steps.q.outputs.mode) == 'names' || (inputs.mode || steps.q.outputs.mode) == 'metadata' || (inputs.mode || steps.q.outputs.mode) == 'artists' || (inputs.mode || steps.q.outputs.mode) == 'radepth' || (inputs.mode || steps.q.outputs.mode) == 'genres')))
        run: |
          git config user.name "sonic-bot"
          git config user.email "sonic@earlysignal.live"
          git pull --rebase --autostash -q origin main || true
          git add -f sonic.db 2>/dev/null || true
          git add data/ 2>/dev/null || true
          git add backfill-report.md backfill-report.json 2>/dev/null || true
          git add CLAIMS.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "${{ (inputs.mode || steps.q.outputs.mode) || 'weekly' }} run $(date +%G-W%V)"
          git push
