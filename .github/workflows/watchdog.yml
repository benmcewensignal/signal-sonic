name: watchdog
on:
  schedule:
    - cron: "*/20 * * * *"      # every twenty minutes, when GitHub honours it
  workflow_run:
    workflows: ["sonic"]         # after a pipeline run ends, chained or not
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sonic-watchdog          # never shares a group with the pipeline it unblocks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: cancel stuck runs and restart a stalled chain
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: python -m sonic.watchdog --repo ${{ github.repository }}

      - name: heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          # GitHub forbids a workflow triggering itself with workflow_run, and throttles cron on
          # quiet repos. So the watchdog schedules its own next check: wait, then dispatch. The
          # concurrency group cancels any overlap, so this cannot pile up.
          set +e
          sleep 600
          gh workflow run watchdog.yml --ref main && echo "next check armed" || echo "could not arm"
          exit 0
