name: watchdog
on:
  schedule:
    - cron: "*/20 * * * *"      # every twenty minutes, when GitHub honours it
  workflow_run:
    workflows: ["sonic"]         # after a pipeline run ends, chained or not
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sonic-watchdog          # never shares a group with the pipeline it unblocks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: cancel stuck runs and restart a stalled chain
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: python -m sonic.watchdog --repo ${{ github.repository }}

      - name: make sure the weekly batch has run this week
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          # This used to act only on Sundays, and only when no sonic run at all had happened in
          # twenty hours, which never happens: the four-hourly cron and the queue chain are always
          # running. So it never dispatched, and the Sunday 03:00 cron itself did not fire on 6, 13
          # or 20 September. W37 and W38 were lost for good: the chart is a snapshot of today.
          # Ask the question that matters, every day: is this week's chart file on main?
          set +e
          WEEK=$(date -u +%G-W%V)
          if gh api "repos/${{ github.repository }}/contents/data/weeks/$WEEK.json.gz?ref=main" --silent 2>/dev/null; then
            echo "$WEEK is captured"
          else
            echo "$WEEK is not captured yet: dispatching the weekly batch"
            timeout 60 gh workflow run sonic.yml --ref main -f mode=week && echo "weekly batch dispatched" || echo "could not dispatch the weekly batch"
          fi
          exit 0

      - name: wake the other pipelines if their cron has gone quiet
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          # GitHub cron is unreliable: features missed twelve consecutive hourly slots on
          # 2026-09-17 with the workflow active. This watchdog re-arms itself and fires
          # every twenty minutes regardless, so it kicks the others when they go quiet.
          # Both stand down on their own when a pass produces nothing, so a kick with no
          # work behind it costs one short run.
          set +e
          NOW=$(date -u +%s)
          # features is kicked with the remeasure: separation has only the records Beatport refuses left,
          # so kicking stems-shard restarted the wrong chain (eight records a shard, all failing).
          for R in signal-sonic-audio:audio.yml:rhythm:60 signal-sonic-features:features.yml:stems-remeasure:90; do
            REPO=benmcewensignal/${R%%:*}; REST=${R#*:}; WF=${REST%%:*}; REST=${REST#*:}; TASK=${REST%%:*}; QUIET=${REST#*:}
            LAST=$(gh api "repos/${REPO}/actions/runs?per_page=1" --jq '.workflow_runs[0].updated_at' 2>/dev/null)
            LIVE=$(gh api "repos/${REPO}/actions/runs?per_page=5" --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null)
            if [ -z "$LAST" ]; then echo "${REPO}: could not read runs"; continue; fi
            AGE=$(( (NOW - $(date -u -d "$LAST" +%s)) / 60 ))
            echo "${REPO}: last run ${AGE}m ago, ${LIVE:-?} live"
            # audio after an hour: its hourly cron fired 6 times in 24 slots on 21 September
            if [ "${LIVE:-0}" = "0" ] && [ "$AGE" -gt "$QUIET" ]; then
              timeout 60 gh workflow run "$WF" --repo "$REPO" --ref main -f task="$TASK" && echo "  kicked" || echo "  could not kick (needs PIPELINE_PAT for another repo)"
            fi
          done
          exit 0
      - name: heartbeat
        if: always()
        timeout-minutes: 12          # the step sleeps ten; anything longer is a hang, not work
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          # GitHub forbids a workflow triggering itself with workflow_run, and throttles cron on
          # quiet repos, so the watchdog schedules its own next check: wait, then dispatch.
          # Every call is bounded: a hung dispatch must not hold the concurrency group, because
          # the group is what the pipeline itself needs in order to run.
          set +e
          sleep 600
          timeout 60 gh workflow run watchdog.yml --ref main && echo "next check armed" || echo "could not arm"
          exit 0
