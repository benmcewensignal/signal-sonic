name: watchdog
on:
  schedule:
    - cron: "*/20 * * * *"      # every twenty minutes, when GitHub honours it
  workflow_run:
    workflows: ["sonic", "watchdog"]   # after a pipeline run, and after itself, so an idle
    types: [completed]                 # pipeline cannot leave the watchdog asleep too
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sonic-watchdog          # never shares a group with the pipeline it unblocks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pace itself
        if: github.event_name == 'workflow_run'
        run: sleep 540              # ten minutes between self-triggered checks, so it cannot spin

      - name: cancel stuck runs and restart a stalled chain
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: python -m sonic.watchdog --repo ${{ github.repository }}
