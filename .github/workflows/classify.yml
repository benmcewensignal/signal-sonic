name: classify
# Classification step one: what the sound can and cannot separate among all 36 Beatport tags.
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  step1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy "scikit-learn==1.8.0"
      - name: fetch the corpus database
        env: { GH_TOKEN: "${{ secrets.PIPELINE_PAT || github.token }}" }
        run: for i in 1 2 3 4 5; do gh release download deepened --repo benmcewensignal/signal-sonic --pattern sonic.db --clobber --dir /tmp && [ -s /tmp/sonic.db ] && break; sleep $((i*20)); done
      - name: step one
        run: python tools/classify.py /tmp/sonic.db
      - name: save
        run: |
          git config user.name sonic-bot; git config user.email sonic@earlysignal.live
          git add data/classification && git commit -qm "classification step 1: separability of all 36 tags, clusters against tags, persistence" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; sleep $((i*4)); done
