name: tracklists
# DJ sets from MixesDB tracklists (CC BY-SA 3.0): timestamped records matched to Beatport. The records
# the sets play that the corpus lacks are measured on the corpus analyser by tracklists-measure.yml,
# alongside this crawl, since 9 Oct (MEASURE_ALONGSIDE below; before that, here, in turn with fetching).
# Results are committed under data/tracklists/, and imported into the release database.
on:
  workflow_dispatch:
    inputs:
      djs:      { description: "MixesDB artist categories, comma separated", default: "Carl Cox,Andy C" }
      since:    { description: "first year of sets", default: "2023" }
      measure:  { description: "records to measure this run", default: "300" }
      max_sets: { description: "most recent sets per DJ", default: "40" }
      chain:    { description: "start the next tracklist batch afterwards", default: "no" }
      measure_only: { description: "only work through the measuring backlog", default: "false" }
permissions:
  contents: write
  actions: write
concurrency:
  group: tracklists
  cancel-in-progress: false
jobs:
  handover:
    # measuring runs alongside the crawl from 9 Oct (tracklists-measure.yml). A measuring run booked by a crawl run that
    # started before the change hands the backlog to that chain and starts the next batch, as it would have on finishing
    if: inputs.measure_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in 1 2 3; do timeout 60 gh workflow run tracklists-measure.yml --repo "${{ github.repository }}" --ref main && { echo "measuring chain started"; break; }; sleep $((i*15)); done
          if [ "${{ inputs.chain }}" = "yes" ]; then
            for i in 1 2 3 4 5; do timeout 60 gh workflow run tracklist-batches.yml --repo "${{ github.repository }}" --ref main -f since="${{ inputs.since }}" -f max_sets="${{ inputs.max_sets }}" -f chain=yes && { echo "next batch started"; exit 0; }; sleep $((i*20)); done
            exit 1
          fi
  sets:
    if: inputs.measure_only != 'true'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 19 Oct 2026, under the audio decoding
    timeout-minutes: 330
    env:
      # yes: this job fetches and matches only, and tracklists-measure.yml measures the backlog alongside it, in shards
      # as wide as the idle job slots. no: the old way, measuring here and booking measuring-only runs before fetching more
      MEASURE_ALONGSIDE: "yes"
      BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
      BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
      BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
      BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # a shallow copy cannot rebase, and the first run's save was lost that way
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        run: |
          sudo apt-get install -y -q ffmpeg >/dev/null
          pip install -q -r requirements.txt
      - name: fetch the database (read only)
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          for i in 1 2 3; do gh release download deepened --pattern sonic.db --clobber --dir . && [ -s sonic.db ] && break; sleep 20; done
          cp sonic.db /tmp/base.db
          gh api "repos/${{ github.repository }}/releases/tags/deepened" --jq '.assets[] | select(.name=="sonic.db") | .id' > /tmp/base.id
      - name: sets and matches
        if: inputs.measure_only != 'true'
        run: python -m sonic.tracklists --djs "${{ inputs.djs }}" --since "${{ inputs.since }}" --measure 0 --max-sets "${{ inputs.max_sets }}"
      - name: set curves on 3.0 (records on other versions are counted and left out)
        if: always()
        # every DJ with a file, not just this run's: a measuring run has no DJs, and computing curves for
        # "none" wrote an empty file over the full one on 24 September
        run: python -m sonic.set_curves --db sonic.db --ver 3.0 --djs "$(ls data/tracklists/*.json | grep -v curves | xargs -n1 basename | sed 's/\.json$//' | paste -sd, -)" || true
      - name: save the tracklists as soon as they are matched, before the long measuring
        if: inputs.measure_only != 'true'
        run: |
          git config user.name sonic-bot; git config user.email sonic@earlysignal.live
          git add data/tracklists/*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "tracklists: ${{ inputs.djs }} since ${{ inputs.since }} (matched)"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash -X theirs origin main && git push -q origin HEAD:main && break; sleep $((i*4)); done
      - name: measure the records the sets play and the corpus lacks
        if: env.MEASURE_ALONGSIDE != 'yes'
        run: python -m sonic.tracklists --djs none --measure "${{ inputs.measure }}" --measure-only
      - name: keep the results whatever happens to the push
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: tracklists, path: data/tracklists, retention-days: 30 }
      - name: import into the corpus database and save it through the merge
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          python -m sonic.tracklists_import --db sonic.db
          python -m sonic.classics --db sonic.db --limit 500 || echo "::warning title=classics::the classics step failed; the tracklists are still saved"
          bash scripts/release_save.sh "${{ github.repository }}" "${{ github.run_id }}" /tmp/base.db /tmp/base.id sonic.db
      - name: save
        if: always()
        run: |
          git config user.name sonic-bot; git config user.email sonic@earlysignal.live
          git add data/tracklists || true
          git diff --cached --quiet && exit 0
          # GitHub refuses any file over 100 MiB (104,857,600 bytes), and every retry below fails the same way: measured.jsonl
          # reached it on 8 Oct (run 120) and now rolls into measured-2.jsonl and on. Name a file over the limit rather than
          # retrying. The limit in bytes: the first version of this check used -size +95M, which find rounds up to whole MiB,
          # so it caught measured.jsonl itself (104,743,363 bytes, already accepted) and failed every save from run 122 to 152
          BIG=$(find data/tracklists -type f -size +104857600c -printf '%p %s bytes\n')
          [ -z "$BIG" ] || { echo "::error title=save::files over GitHub's 100 MiB limit, which it refuses: $BIG"; exit 1; }
          git commit -qm "tracklists: ${{ inputs.djs }} since ${{ inputs.since }}"
          # this folder is the job's own (the queue keeps main's copy), so on a conflict the run's files win
          ok=0; for i in 1 2 3 4 5; do git pull -q --rebase --autostash -X theirs origin main && git push -q origin HEAD:main && { ok=1; break; }; sleep $((i*4)); done
          [ "$ok" = 1 ] || { echo "::error::tracklists were not saved to the repository (the artifact holds them)"; exit 1; }
      - name: book the next run while records remain unmeasured
        if: success() && env.MEASURE_ALONGSIDE != 'yes'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
        run: |
          LEFT=$(( $(cat /tmp/tracklists_left.txt 2>/dev/null || echo 0) + $(cat /tmp/classics_left.txt 2>/dev/null || echo 0) ))   # records the sets play, and classics
          # retried: a single failed dispatch ends the chain (17:00 on 7 Oct); if every try fails, LEFT stays unset and the next step starts a batch, which measures too
          if [ "$LEFT" -gt 0 ]; then
            for i in 1 2 3 4 5; do
              if timeout 60 gh workflow run tracklists.yml -f measure_only=true -f measure=1200 -f djs=none -f chain="${{ inputs.chain || 'no' }}" -f since="${{ inputs.since }}" -f max_sets="${{ inputs.max_sets }}"; then echo "booked a measuring run for $LEFT records"; echo "LEFT=$LEFT" >> "$GITHUB_ENV"; break; fi
              echo "could not book it (try $i)"; sleep $((i*20))
            done
          fi
      - name: hand the backlog to the measuring chain
        # one pass at a time (its own concurrency group), so a pass already under way just gains a successor
        if: always() && env.MEASURE_ALONGSIDE == 'yes'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in 1 2 3; do timeout 60 gh workflow run tracklists-measure.yml --repo "${{ github.repository }}" --ref main && { echo "measuring pass requested"; exit 0; }; sleep $((i*15)); done
          echo "::warning::could not start a measuring pass; the next crawl run asks again"
      - name: the next batch
        # the chain carries through the measuring runs, and only the run that leaves nothing unmeasured starts the next batch
        if: always() && inputs.chain == 'yes' && env.LEFT == ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # retried, as the watchdog's own hand-off is; if it still fails, the watchdog restarts the crawl within the hour
          for i in 1 2 3 4 5; do
            if timeout 60 gh workflow run tracklist-batches.yml --repo "${{ github.repository }}" --ref main -f since="${{ inputs.since }}" -f max_sets="${{ inputs.max_sets }}" -f chain=yes; then echo "next batch started"; exit 0; fi
            echo "could not start the next batch (try $i)"; sleep $((i*20))
          done
          exit 1
