name: deepen

permissions:
  contents: write
  actions: write

# Six shards measure in parallel, one job writes. The database is a single SQLite file in
# this repository, so parallel writers would clobber each other: the shards emit jsonl,
# and the merge folds them in afterwards, in order, once.

on:
  workflow_dispatch:
    inputs:
      month_from: {description: first month, default: "2025-09"}
      month_to:   {description: last month,  default: "2026-08"}
      per_month:  {description: records per scene-month, default: "150"}
      merge_run:  {description: "fold in earlier runs' artifacts instead of measuring again (run ids, comma separated)", default: ""}

concurrency:
  # keyed on the month range, not the workflow: three ranges can then measure at once
  # instead of queueing behind each other. Six shards a run, eighteen jobs, inside the
  # twenty a public repository gets free.
  group: deepen-${{ inputs.month_from }}-${{ inputs.month_to }}-${{ inputs.merge_run }}
  cancel-in-progress: false

jobs:
  shard:
    if: inputs.merge_run == ''          # a recovery run measures nothing: the work exists
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false          # one shard failing must not discard the other five
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: deps
        run: pip install -q numpy librosa soundfile
      - name: measure this shard
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
          BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
        run: |
          python -m sonic.deepen_shard --shard ${{ matrix.shard }} --of 6 \
            --from ${{ inputs.month_from }} --to ${{ inputs.month_to }} \
            --per-month ${{ inputs.per_month }} --db sonic.db --out out --budget-minutes 100
      - uses: actions/upload-artifact@v4
        with:
          name: deepen-shard-${{ matrix.shard }}
          path: out/deepen-shard-*.jsonl
          if-no-files-found: warn

  merge:
    needs: shard
    permissions:
      contents: write
    if: always()                # merge whatever the shards did manage, or an earlier run's
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: deps
        # the fold imports the analyser to read a feature vector, and that needs the
        # audio stack even though it decodes nothing here
        run: pip install -q numpy librosa soundfile
      - name: take this run's artifacts
        if: inputs.merge_run == ''
        uses: actions/download-artifact@v4
        with: {path: shards}
      - name: or earlier runs', when recovering
        if: inputs.merge_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p shards
          for RUN in $(echo "${{ inputs.merge_run }}" | tr ',' ' '); do
            echo "taking artifacts from run $RUN"
            gh run download "$RUN" --dir "shards/run-$RUN" --repo ${{ github.repository }} || echo "  nothing from $RUN"
          done
          find shards -name '*.jsonl' | head -20
          echo "total shard files: $(find shards -name '*.jsonl' | wc -l)"

      - name: start from the deepened database if one exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release download deepened --pattern sonic.db --dir /tmp/prev --clobber 2>/dev/null
          if [ -f /tmp/prev/sonic.db ]; then
            python - <<'PY'
          import sqlite3
          def n(p):
              try: return sqlite3.connect(p).execute("select count(*) from tracks where analyser_id='local'").fetchone()[0]
              except Exception: return -1
          mine, prev = n("sonic.db"), n("/tmp/prev/sonic.db")
          print(f"repository has {mine}, the deepened release has {prev}")
          if prev > mine:
              import shutil; shutil.copy("/tmp/prev/sonic.db", "sonic.db"); print("starting from the deepened one")
          PY
          fi
          exit 0

      - name: fold the shards into the database
        run: |
          ls -la shards/*/ || true
          python -m sonic.import_deepen --db sonic.db --glob 'shards/**/deepen-shard-*.jsonl' --report merge.json
      - name: check it actually grew
        run: |
          python - <<'PY'
          import json, sqlite3
          m=json.load(open("merge.json"))
          c=sqlite3.connect("sonic.db")
          deep=c.execute("select count(*) from (select scene, week, count(*) k from track_scenes where week like '____-M__' group by scene, week having k>=135)").fetchone()[0]
          print(json.dumps({**m, "deep_scene_months": deep}, indent=1))
          if m["records_added"] == 0:
              raise SystemExit("merge added nothing: the shards measured nothing worth keeping")
          PY
      - name: publish the merged database as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Not a git push. This database is written by the queue chain too, and a second
          # writer to a shared binary file has failed four different ways this afternoon:
          # a mixed report, missing deps, a rebase that cannot merge bytes, and permissions.
          # So the merge publishes its result and the chain picks it up. One writer.
          ls -la sonic.db
          gh release delete deepened -y 2>/dev/null || true
          gh release create deepened sonic.db \
            --title "deepened database" \
            --notes "Folded from run ${{ inputs.merge_run != '' && inputs.merge_run || github.run_id }}. The queue chain adopts this on its next run." \
            || gh release upload deepened sonic.db --clobber
          echo "published"
