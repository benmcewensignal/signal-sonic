name: keys
# Beatport's own key and tempo for the records the DJ tool places (sonic/key_fill.py), 3,000 a run, chaining while
# records remain. Writes data/track-keys.json; it never touches the database.
on: { workflow_dispatch: {} }
concurrency: { group: sonic-keys, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: "1"
      BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
      BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
      BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
      BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip -q install -r requirements.txt
      - name: keys
        id: k
        run: |
          python -m sonic.key_fill | tee /tmp/k.log
          LEFT=$(grep -o '"left": [0-9]*' /tmp/k.log | tail -1 | grep -o '[0-9]*' || true); echo "left=${LEFT:-0}" >> "$GITHUB_OUTPUT"
      - name: keep the keys
        id: keep
        run: |
          git config user.name "sonic-bot"; git config user.email "sonic@earlysignal.live"
          git add data/track-keys.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "Beatport keys: $(date -u +%FT%TZ)"
          for i in 1 2 3; do if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi; sleep $((i*10)); done
          echo "::error title=keys::push failed"; exit 1
      - name: chain while records remain
        if: steps.keep.outputs.pushed == '1' && steps.k.outputs.left != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run keys.yml --repo "${{ github.repository }}" --ref main
