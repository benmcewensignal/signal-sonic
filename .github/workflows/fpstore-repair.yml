name: fpstore-repair
# Recover a damaged fingerprint store: fetch it, keep what SQLite can still read, check the result,
# save it with the integrity-checked save, then rebuild Listen's recognition index from it.
# Each stage is its own step, because a step's name is the one thing readable about a failure.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: { GH_TOKEN: "${{ secrets.PIPELINE_PAT || github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - name: install sqlite3
        run: sudo apt-get install -y -q sqlite3 >/dev/null && sqlite3 --version
      - name: fetch the damaged store
        run: |
          bash scripts/fpstore.sh fetch "${{ github.repository }}" damaged.db
          ls -la damaged.db
          echo "::notice title=fetched::$(stat -c %s damaged.db) bytes"
      - name: inspect it
        run: |
          python3 - << 'PY' || true
          import sqlite3
          c = sqlite3.connect("damaged.db")
          try: q = c.execute("pragma quick_check").fetchone()[0]
          except Exception as e: q = f"{type(e).__name__}: {e}"
          try: n = c.execute("select count(*) from fp_tracks").fetchone()[0]
          except Exception as e: n = f"{type(e).__name__}"
          print(f"::notice title=damaged store::check {str(q)[:150]}; fp_tracks {n}")
          PY
      - name: recover what can be read
        run: |
          python3 - << 'PY'
          import sqlite3
          src = sqlite3.connect("damaged.db"); dst = sqlite3.connect("fingerprints.db")
          tables = [(n, s) for n, s in src.execute("select name, sql from sqlite_master where type='table' and sql is not null")]
          for n, s in tables: dst.execute(s)
          kept = lost = 0
          for n, _ in tables:
              try: hi = src.execute(f"select max(rowid) from [{n}]").fetchone()[0] or 0
              except Exception: hi = 0
              step = 200
              for a in range(0, hi + 1, step):
                  try:
                      rows = src.execute(f"select * from [{n}] where rowid between ? and ?", (a, a + step - 1)).fetchall()
                  except Exception:
                      lost += step; continue
                  if rows:
                      dst.executemany(f"insert or ignore into [{n}] values ({','.join('?' * len(rows[0]))})", rows); kept += len(rows)
              dst.commit()
          for n, s in src.execute("select name, sql from sqlite_master where type='index' and sql is not null"):
              try: dst.execute(s)
              except Exception: pass
          dst.commit()
          q = dst.execute("pragma quick_check").fetchone()[0]; nt = dst.execute("select count(*) from fp_tracks").fetchone()[0]
          print(f"::notice title=recovered::{nt} records in fp_tracks ({kept} rows kept across tables, about {lost} row slots unreadable); integrity {q}")
          assert q == "ok" and nt > 5000
          PY
      - name: save it and rebuild the index
        run: |
          bash scripts/fpstore.sh save "${{ github.repository }}" fingerprints.db "${{ github.run_id }}"
          gh workflow run audio.yml --repo benmcewensignal/signal-sonic-audio --ref main -f task=full-index && echo "::notice title=index::rebuild requested"
