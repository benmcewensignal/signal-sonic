name: tracklist-batches
# The next 40 DJs who chart and are artists Signal knows (sonic/tracklist_batches.py) sent to the tracklist job, and
# recorded as tried. The watchdog runs this daily, so the candidate list works through about 40 DJs a day.
on:
  workflow_dispatch:
    inputs:
      since:    { description: "first year of sets", default: "2019" }
      size:     { description: "DJs per batch", default: "60" }
      max_sets: { description: "most recent sets per DJ", default: "150" }
      wide:     { description: "use the wide candidate list", default: "yes" }
      chain:    { description: "start the next batch when this one ends", default: "yes" }
permissions: { contents: write, actions: write }
concurrency: { group: sonic-tracklist-batches, cancel-in-progress: false }
jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: next batch
        id: b
        run: |
          C=data/tracklists-candidates.json; [ "${{ inputs.wide || 'yes' }}" = "yes" ] && C=data/tracklists-candidates-wide.json
          B=$(python -m sonic.tracklist_batches "${{ inputs.size || '60' }}" "${{ inputs.since || '2019' }}" "$C"); echo "djs=$B" >> "$GITHUB_OUTPUT"; echo "batch: $B"
      - name: record it and send it
        if: steps.b.outputs.djs != ''
        run: |
          git config user.name "sonic-bot"; git config user.email "sonic@earlysignal.live"
          for i in 1 2 3; do
            S="${{ inputs.since || '2019' }}"; cp data/tracklists-tried-$S.json "$RUNNER_TEMP/t.json"; git fetch -q origin main && git reset -q --hard origin/main && cp "$RUNNER_TEMP/t.json" data/tracklists-tried-$S.json
            git add data/tracklists-tried-$S.json; git diff --cached --quiet || git commit -qm "tracklist batch: $(date -u +%FT%TZ)"
            if git push -q origin HEAD:main; then break; fi; sleep $((i*10))
          done
          gh workflow run tracklists.yml --repo "${{ github.repository }}" --ref main -f djs="${{ steps.b.outputs.djs }}" -f since="${{ inputs.since || '2019' }}" -f measure=300 -f max_sets="${{ inputs.max_sets || '150' }}" -f chain="${{ inputs.chain || 'yes' }}"
