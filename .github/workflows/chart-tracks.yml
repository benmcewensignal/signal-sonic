name: chart-tracks
# Beatport's facts for every record DJs chart (sonic/chart_tracks.py): label, artists, BPM, key, preview, release
# date. 3,000 a run, chaining while charted records remain; it never touches the database.
on: { workflow_dispatch: {} }
concurrency: { group: sonic-chart-tracks, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: "1"
      BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
      BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
      BEATPORT_TOKEN: ${{ secrets.BEATPORT_TOKEN }}
      BEATPORT_CLIENT_ID: ${{ secrets.BEATPORT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip -q install -r requirements.txt
      - name: keys
        id: k
        run: |
          python -m sonic.chart_tracks | tee /tmp/k.log
          LEFT=$(grep -o '"left": [0-9]*' /tmp/k.log | tail -1 | grep -o '[0-9]*' || true); echo "left=${LEFT:-0}" >> "$GITHUB_OUTPUT"
      - name: keep the keys
        id: keep
        run: |
          git config user.name "sonic-bot"; git config user.email "sonic@earlysignal.live"
          git add data/chart-tracks.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "chart tracks: $(date -u +%FT%TZ)"
          for i in 1 2 3; do if git pull -q --rebase origin main && git push -q origin HEAD:main; then echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi; sleep $((i*10)); done
          echo "::error title=chart tracks::push failed"; exit 1
      - name: chain while records remain
        if: steps.keep.outputs.pushed == '1' && steps.k.outputs.left != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run chart-tracks.yml --repo "${{ github.repository }}" --ref main
      - name: re-arm the watchdog if it has stopped
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # the watchdog re-arms itself every ten minutes; if a dispatch fails and GitHub's cron does not fire, it stops.
          # This job runs constantly, so it restarts the watchdog when its last run is more than 30 minutes old.
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/watchdog.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""' 2>/dev/null)
          if [ -n "$LAST" ] && [ $(( $(date -u +%s) - $(date -u -d "$LAST" +%s) )) -gt 1800 ]; then gh workflow run watchdog.yml --repo "${{ github.repository }}" --ref main && echo "watchdog restarted"; else echo "watchdog alive"; fi
